<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Page Maker</title>
<style id="uicss">
  :root { --ui-bg:#eef0f4; --ui-panel:#fff; --ui-ink:#1d2330; --ui-mute:#667085; --ui-line:#d8dce6; --ui-acc:#3b5bdb; }
  @media (prefers-color-scheme: dark) {
    :root { --ui-bg:#14171f; --ui-panel:#1c2030; --ui-ink:#e8ebf3; --ui-mute:#9aa3b8; --ui-line:#2e3448; --ui-acc:#7c93ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ui-bg); color:var(--ui-ink); font:14px/1.4 system-ui, sans-serif; display:flex; min-height:100vh; }
  #panel { width:310px; flex:none; background:var(--ui-panel); border-right:1px solid var(--ui-line); padding:14px; overflow:auto; height:100vh; position:sticky; top:0; }
  #panel h1 { font-size:17px; margin:0 0 2px; }
  #panel h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ui-mute); margin:16px 0 8px; }
  #panel p.tip { color:var(--ui-mute); font-size:12px; margin:4px 0 0; }
  .row { display:flex; gap:6px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  .row label { flex:1 1 100px; color:var(--ui-mute); font-size:12px; }
  .row input[type=range] { flex:2 1 120px; }
  .row input[type=text], .row select { flex:2 1 120px; padding:6px 8px; border:1px solid var(--ui-line); border-radius:6px; background:transparent; color:inherit; font:inherit; }
  .row input[type=color] { width:38px; height:28px; padding:0; border:1px solid var(--ui-line); border-radius:6px; background:none; }
  button { font:inherit; padding:7px 11px; border:1px solid var(--ui-line); background:transparent; color:inherit; border-radius:7px; cursor:pointer; }
  button:hover { border-color:var(--ui-acc); }
  button.pri { background:var(--ui-acc); border-color:var(--ui-acc); color:#fff; font-weight:600; }
  button.on { background:var(--ui-acc); color:#fff; border-color:var(--ui-acc); }
  button.sm { padding:4px 9px; font-size:12px; }
  #none { color:var(--ui-mute); font-size:13px; }
  #stagewrap { flex:1; overflow:auto; padding:66px 22px 22px; display:flex; justify-content:center; align-items:flex-start; }
  #stage { position:relative; }
  #topbar { position:fixed; top:12px; right:16px; z-index:30; display:flex; gap:8px; align-items:center; background:var(--ui-panel); border:1px solid var(--ui-line); border-radius:12px; padding:8px; box-shadow:0 6px 22px rgba(0,0,0,.16); }
  #topbar input[type=text], #topbar select { padding:7px 9px; border:1px solid var(--ui-line); border-radius:7px; background:transparent; color:inherit; font:inherit; }
  #topbar input[type=text] { width:200px; }
  #more { position:relative; }
  #more summary { list-style:none; cursor:pointer; padding:6px 12px; border:1px solid var(--ui-line); border-radius:7px; font-size:18px; line-height:1; user-select:none; }
  #more summary::-webkit-details-marker { display:none; }
  #more .menu { position:absolute; right:0; top:calc(100% + 6px); min-width:190px; background:var(--ui-panel); border:1px solid var(--ui-line); border-radius:10px; padding:6px; display:flex; flex-direction:column; gap:4px; box-shadow:0 8px 24px rgba(0,0,0,.2); }
  #more .menu button { text-align:left; border:0; }
  #more .menu button:hover { background:var(--ui-bg); }
  @media (max-width: 900px) { #topbar { position:static; margin:10px; flex-wrap:wrap; } #stagewrap { padding-top:22px; } }
  #bubble { position:absolute; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:2px; max-width:600px; background:#1d2330; color:#fff; border-radius:10px; padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  #bubble[hidden] { display:none; }
  #bubble button { background:transparent; color:#fff; border:0; padding:5px 8px; border-radius:6px; font-size:13px; line-height:1.1; }
  #bubble button:hover { background:#3b5bdb; }
  #bubble button.on { background:#3b5bdb; }
  #bubble button.danger:hover { background:#e03131; }
  #bubble .sep { width:1px; align-self:stretch; background:#4a5268; margin:2px 3px; }
  #bubble input[type=color] { width:26px; height:24px; padding:0; border:0; border-radius:5px; background:none; cursor:pointer; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#1d2330; color:#fff; padding:9px 14px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; }
  #toast.show { opacity:1; }
  #over { display:none; position:absolute; left:0; right:0; border-top:2px dashed #e03131; font-size:11px; color:#e03131; text-align:right; padding-top:2px; }
  .hint-drop { outline:3px dashed var(--ui-acc); outline-offset:-6px; }
  @media (max-width: 900px) { body { flex-direction:column; } #panel { width:100%; height:auto; position:static; border-right:0; border-bottom:1px solid var(--ui-line); } }
  @media print { #panel, #topbar, #bubble, #toast, #over { display:none !important; } body { background:#fff; display:block; } #stagewrap { padding:0; display:block; overflow:visible; } #stage { width:auto !important; height:auto !important; } #sheet { transform:none !important; box-shadow:none !important; } .ui { display:none !important; } @page { size:A4; margin:0; } }
</style>

<style id="sheetcss">
  .sheet { position:relative; width:794px; height:1122px; background:#fff; color:#000; box-sizing:border-box; overflow:visible; transform-origin:top left; box-shadow:0 2px 14px rgba(0,0,0,.18); font-family:var(--font); }
  .sheet .inner { position:absolute; inset:0; padding:var(--padv) var(--padh); display:flex; flex-direction:column; }
  .sheet .frame { position:absolute; inset:var(--frameInset); border:var(--frameW) solid var(--frameC); pointer-events:none; }
  .blk { position:relative; flex:none; }
  .blk .t { outline:none; white-space:pre-wrap; word-break:break-word; min-height:1em; }
  .blk .t b, .blk .t strong { font-weight:700; }
  .logo { display:flex; }
  .logo img, .logo svg { display:block; max-width:100%; height:auto; }
  .divider { border:0; border-top:1px solid #000; margin:0; }
  table.tb { border-collapse:collapse; margin:0 auto; table-layout:fixed; }
  table.tb th, table.tb td { border:1px solid var(--grid); padding:6px 8px; text-align:center; vertical-align:middle; word-break:break-word; }
  table.tb th { background:var(--head); color:var(--headInk); font-weight:400; }
  table.tb td { background:var(--row); }
  table.tb [contenteditable] { outline:none; min-height:1em; }
  /* editor-only chrome */
  .ui { font:12px system-ui, sans-serif; }
  .blk .grip { position:absolute; left:-40px; top:0; width:20px; height:22px; cursor:grab; background:var(--ui-acc, #3b5bdb); color:#fff; border-radius:4px; text-align:center; line-height:22px; opacity:0; user-select:none; }
  .blk:hover .grip, .blk.sel .grip { opacity:1; }
  .blk:hover { outline:1px dashed #9aa8ff; outline-offset:3px; }
  .blk.sel { outline:2px solid #3b5bdb; outline-offset:3px; }
  .blk.dropbefore::before, .blk.dropafter::after { content:""; position:absolute; left:-8px; right:-8px; height:3px; background:#3b5bdb; }
  .blk.dropbefore::before { top:-5px; } .blk.dropafter::after { bottom:-5px; }
  .logo.empty { border:2px dashed #9aa8ff; color:#6b78c9; align-items:center; justify-content:center; height:90px; font:13px system-ui; cursor:pointer; }
  .logo .cap { position:absolute; right:-6px; top:-6px; display:flex; gap:4px; opacity:0; }
  .blk.sel .logo .cap, .blk:hover .logo .cap { opacity:1; }
  .logo .cap button { background:#fff; color:#222; border:1px solid #bbb; padding:2px 7px; font-size:11px; }
  .logo { position:relative; }
</style>
</head>
<body>
<div id="topbar">
  <input type="text" id="fname" value="cover-page" title="File name" aria-label="File name">
  <select id="fmt" title="Download format" aria-label="Download format"><option value="png">PNG</option><option value="pdf">PDF</option></select>
  <button class="pri" id="bDownload">⬇ Download</button>
  <details id="more"><summary title="More options">⋯</summary>
    <div class="menu">
      <button id="bPrint">Print</button>
      <button id="bLink">Copy link</button>
      <button id="bSave">Save design (.json)</button>
      <button id="bLoad">Load design…</button>
      <button id="bReset">Reset</button>
    </div>
  </details>
  <input type="file" id="fJson" accept="application/json,.json" hidden>
  <input type="file" id="fImg" accept="image/*" hidden>
</div>
<aside id="panel">
  <h1>Cover Page Maker</h1>
  <p class="tip">Click any text to edit it. Click a block to style it. Drag the blue grip to reorder. Drop an image on the logo.</p>

  <h2>Selected block</h2>
  <div id="none">Nothing selected. Click a line, the logo or the table.</div>
  <div id="blockctl" hidden>
    <div class="row"><label>Size</label><input type="range" id="cSize" min="8" max="64" step="1"><span id="vSize"></span></div>
    <div class="row">
      <button class="sm" id="cBold"><b>B</b></button><button class="sm" id="cItalic"><i>I</i></button><button class="sm" id="cUnder"><u>U</u></button>
      <button class="sm" id="cL">⟸</button><button class="sm" id="cC">≡</button><button class="sm" id="cR">⟹</button>
      <input type="color" id="cColor" title="Text colour">
    </div>
    <div class="row"><label>Font</label>
      <select id="cFont">
        <option value="">Page font</option>
        <option value="'Times New Roman', 'Liberation Serif', Times, serif">Times / serif</option>
        <option value="Arial, 'Liberation Sans', Helvetica, sans-serif">Arial / sans</option>
        <option value="Georgia, 'DejaVu Serif', serif">Georgia</option>
        <option value="'Arial Black', 'Liberation Sans', sans-serif">Arial Black</option>
        <option value="'Courier New', 'Liberation Mono', monospace">Courier / mono</option>
        <option value="'Palatino Linotype', Palatino, 'Book Antiqua', serif">Palatino</option>
        <option value="'Trebuchet MS', Verdana, sans-serif">Trebuchet</option>
      </select>
    </div>
    <div class="row"><label>Space above</label><input type="range" id="cMt" min="0" max="160" step="2"><span id="vMt"></span></div>
    <div class="row"><label>Space below</label><input type="range" id="cMb" min="0" max="160" step="2"><span id="vMb"></span></div>
    <div class="row"><label>Line height</label><input type="range" id="cLh" min="1" max="2.2" step="0.05"><span id="vLh"></span></div>
    <div class="row"><label>Letter spacing</label><input type="range" id="cLs" min="-1" max="8" step="0.5"><span id="vLs"></span></div>
    <div id="logoctl" hidden>
      <div class="row"><label>Logo width</label><input type="range" id="cLogoW" min="30" max="400" step="2"><span id="vLogoW"></span></div>
      <div class="row"><button class="sm" id="cLogoPick">Choose image…</button><button class="sm" id="cLogoDef">Default logo</button><button class="sm" id="cLogoNone">Remove</button></div>
    </div>
    <div id="tblctl" hidden>
      <div class="row"><button class="sm" id="tAddR">+ row</button><button class="sm" id="tDelR">− row</button><button class="sm" id="tAddC">+ column</button><button class="sm" id="tDelC">− column</button></div>
      <div class="row"><label>Table width</label><input type="range" id="tW" min="200" max="660" step="2"><span id="vtW"></span></div>
      <div class="row"><label>Row text size</label><input type="range" id="tRs" min="9" max="34" step="1"><span id="vtRs"></span></div>
      <div class="row"><label>Header size</label><input type="range" id="tHs" min="8" max="30" step="1"><span id="vtHs"></span></div>
      <div class="row"><label>Row height</label><input type="range" id="tRh" min="0" max="40" step="1"><span id="vtRh"></span></div>
      <div class="row"><label>Bold last column</label><input type="checkbox" id="tBold"></div>
    </div>
    <div class="row"><button class="sm" id="cDup">Duplicate</button><button class="sm" id="cUp">↑</button><button class="sm" id="cDown">↓</button><button class="sm" id="cDel">Delete</button></div>
  </div>

  <h2>Add block</h2>
  <div class="row"><button class="sm" data-add="text">Text line</button><button class="sm" data-add="table">Table</button><button class="sm" data-add="logo">Logo</button><button class="sm" data-add="divider">Divider</button><button class="sm" data-add="spacer">Spacer</button></div>

  <h2>Page</h2>
  <div class="row"><label>Font</label>
    <select id="pFont">
      <option value="'Times New Roman', 'Liberation Serif', Times, serif">Times / serif</option>
      <option value="Arial, 'Liberation Sans', Helvetica, sans-serif">Arial / sans</option>
      <option value="Georgia, 'DejaVu Serif', serif">Georgia</option>
      <option value="'Palatino Linotype', Palatino, 'Book Antiqua', serif">Palatino</option>
      <option value="'Trebuchet MS', Verdana, sans-serif">Trebuchet</option>
      <option value="'Courier New', 'Liberation Mono', monospace">Courier</option>
    </select>
  </div>
  <div class="row"><label>Text scale</label><input type="range" id="pScale" min="0.7" max="1.4" step="0.02"><span id="vpScale"></span></div>
  <div class="row"><label>Top / bottom margin</label><input type="range" id="pPadV" min="10" max="200" step="2"><span id="vpPadV"></span></div>
  <div class="row"><label>Side margin</label><input type="range" id="pPadH" min="10" max="200" step="2"><span id="vpPadH"></span></div>
  <div class="row"><label>Vertical align</label>
    <select id="pJust"><option value="flex-start">Top</option><option value="center">Middle</option><option value="space-between">Spread</option></select></div>
  <div class="row"><label>Page border</label><input type="checkbox" id="pFrame"></div>
  <div class="row"><label>Border thickness</label><input type="range" id="pFrameW" min="1" max="12" step="1"></div>
  <div class="row"><label>Border colour</label><input type="color" id="pFrameC"></div>
  <div class="row"><label>Border inset</label><input type="range" id="pFrameI" min="6" max="60" step="1"><span id="vpFrameI"></span></div>
  <div class="row"><label>Accent text</label><input type="color" id="pAccent"></div>
  <div class="row"><label>Table header</label><input type="color" id="pHead"></div>
  <div class="row"><label>Table header text</label><input type="color" id="pHeadInk"></div>
  <div class="row"><label>Table rows</label><input type="color" id="pRow"></div>
  <div class="row"><label>Table grid lines</label><input type="color" id="pGrid"></div>
  <div class="row"><label>Paper colour</label><input type="color" id="pPaper"></div>
  <div class="row"><label>Zoom</label><input type="range" id="zoom" min="0.4" max="1.4" step="0.05"><span id="vzoom"></span></div>
</aside>

<div id="stagewrap"><div id="stage"><div class="sheet" id="sheet"></div><div id="bubble" class="ui" hidden></div><div id="over" class="ui">Content runs past the bottom of the A4 page</div></div></div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
document.execCommand("defaultParagraphSeparator", false, "br");

/* ---------- default design: the same layout as the reference cover ---------- */
const SHIELD = `<svg viewBox="0 0 100 124" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="sh"><path d="M7 5H93V67C93 94 73 110 50 119C27 110 7 94 7 67Z"/></clipPath></defs><g clip-path="url(#sh)"><rect x="7" y="5" width="43" height="58" fill="#fff"/><rect x="50" y="5" width="43" height="58" fill="#4b1fd1"/><rect x="7" y="63" width="43" height="60" fill="#4b1fd1"/><rect x="50" y="63" width="43" height="60" fill="#fff"/></g><path d="M7 5H93V67C93 94 73 110 50 119C27 110 7 94 7 67Z" fill="none" stroke="#4b1fd1" stroke-width="6" stroke-linejoin="round"/><g fill="#4b1fd1"><path d="M15 22q9-6 18 0v22q-9-5-18 0zM35 22q9-6 18 0v0" opacity="0"/><path d="M14 21q10-5 18 1v21q-8-5-18-1z"/><path d="M36 22q8-6 18-1v21q-10-4-18 1z" transform="translate(-3 0)"/></g><g fill="#fff"><circle cx="71" cy="30" r="5"/><circle cx="71" cy="19" r="5"/><circle cx="71" cy="41" r="5"/><circle cx="60" cy="30" r="5"/><circle cx="82" cy="30" r="5"/></g><circle cx="71" cy="30" r="4" fill="#4b1fd1"/><g fill="#fff"><path d="M13 84q12-14 24-2l8 8q-6 8-14 4l-6-5-8 5q-6-4-4-10z"/><path d="M45 88q10-8 20 0"  opacity="0"/></g><g fill="#4b1fd1"><circle cx="72" cy="82" r="13"/><path d="M64 92l-4 20 12-6 12 6-4-20z"/></g><circle cx="72" cy="82" r="8" fill="#fff"/><circle cx="72" cy="82" r="4" fill="#4b1fd1"/></svg>`;
const SHIELD_URL = "data:image/svg+xml;utf8," + encodeURIComponent(SHIELD);

let uid = 0;
const id = () => "b" + Date.now().toString(36) + (uid++);
const T = (html, o = {}) => ({ id: id(), type: "text", html, size: 15, bold: false, italic: false, under: false, align: "center", color: "", font: "", mt: 0, mb: 0, lh: 1.25, ls: 0, ...o });

function defaults(v = {}) {
  const A = v.accent || "#0e5a6b";
  const g = (k, d) => (v[k] !== undefined && v[k] !== "" ? esc(v[k]) : d);
  const title = g("title", "Assignment 1");
  const rows = [[g("id", "0000000000"), g("name", "Your Full Name")]];
  for (let i = 2; i <= 6; i++) if (v["id" + i] || v["name" + i]) rows.push([g("id" + i, "&nbsp;"), g("name" + i, "&nbsp;")]);
  return {
    v: 1,
    page: { font: v.font || "'Times New Roman', 'Liberation Serif', Times, serif", scale: 1, padV: 62, padH: 70, just: "flex-start", frame: v.border === "1", frameW: 2, frameC: "#222222", frameI: 22, accent: A, head: v.head || "#4472c4", headInk: "#111111", row: v.row || "#dbe5f1", grid: "#8eaadb", paper: "#ffffff", zoom: v.zoom ? +v.zoom : 0.85 },
    blocks: [
      { id: id(), key: "logo", type: "logo", src: v.logo ? v.logo : "", w: 76, mb: 6, align: "center" },
      T(title, { key: "title", size: 31, bold: true, mb: 14 }),
      T(`Course Title: ${g("course", "Course Name")}<br>Course code: ${g("code", "CSE0000000")}`, { key: "course", size: 14, mb: 14 }),
      T(g("term", "Spring 2026"), { key: "term", size: 17 }),
      T(`Batch ${g("batch", "00A Day")}`, { key: "batch", size: 14, mb: 14 }),
      T(`Assignment: ${v.assignment ? g("assignment") : title}`, { key: "assignment", size: 28, bold: true, mb: 14 }),
      T(`<b>Date of Submission</b>: ${g("date", "01-01-2026")}`, { key: "date", size: 14.5, mb: 24 }),
      T("Submitted to-", { size: 14.5, bold: true, mb: 6 }),
      T(g("teacher", "Teacher Name"), { key: "teacher", size: 19, bold: true, color: A, font: "Arial, 'Liberation Sans', Helvetica, sans-serif" }),
      T(g("role", "Lecturer"), { key: "role", size: 19, color: A }),
      T(g("dept", "Department of CSE"), { key: "dept", size: 19, color: A }),
      T(g("university", "Example University"), { key: "university", size: 14, color: A }),
      T(g("city", "City, Country"), { key: "city", size: 14, color: A, mb: 24 }),
      { id: id(), type: "spacer", h: 56 },
      T("Submitted By-", { size: 14.5, bold: true, mb: 12 }),
      { id: id(), type: "table", w: 520, headSize: 13, rowSize: 19, rowH: 8, boldLast: true, mt: 0, mb: 0, headers: ["ID", "Name"], rows },
    ],
  };
}

/* ---------- state ---------- */
let S = null, sel = null;
const QP = new URLSearchParams(location.search);
const FIELD_KEYS = ["title", "course", "code", "term", "batch", "assignment", "date", "teacher", "role", "dept", "university", "city", "id", "name", "logo", "id2", "name2"];
const fromUrl = FIELD_KEYS.some((k) => QP.has(k));
const KEY = "cover.v1" + (fromUrl ? ":" + location.search : "");
const urlVals = () => Object.fromEntries([...QP.entries()]);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let saveT; const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(() => { save(); checkOverflow(); }, 250); };
const blockById = (i) => S.blocks.find((b) => b.id === i);

/* ---------- render ---------- */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function textStyle(b) {
  const sc = S.page.scale;
  return `font-size:${(b.size * sc).toFixed(2)}px;font-weight:${b.bold ? 700 : 400};font-style:${b.italic ? "italic" : "normal"};text-decoration:${b.under ? "underline" : "none"};text-align:${b.align};line-height:${b.lh};letter-spacing:${b.ls}px;` +
    (b.color ? `color:${b.color};` : "") + (b.font ? `font-family:${b.font};` : "");
}
function blockHtml(b) {
  const mt = b.mt ?? 0, mb = b.mb ?? 0;
  let inner = "";
  if (b.type === "text") inner = `<div class="t" contenteditable="true" spellcheck="false" style="${textStyle(b)}">${b.html}</div>`;
  else if (b.type === "logo") {
    const img = b.src ? `<img src="${esc(b.src)}" style="width:${b.w}px" alt="logo">` : "";
    const just = b.align === "left" ? "flex-start" : b.align === "right" ? "flex-end" : "center";
    inner = b.src === ""
      ? `<div class="logo" style="justify-content:${just}"><div style="width:${b.w}px">${SHIELD}</div><div class="cap ui"><button data-act="pick">Replace</button></div></div>`
      : b.src === null
        ? `<div class="logo empty ui" data-act="pick">Drop a logo image here or click to choose</div>`
        : `<div class="logo" style="justify-content:${just}">${img}<div class="cap ui"><button data-act="pick">Replace</button></div></div>`;
  } else if (b.type === "divider") inner = `<hr class="divider" style="border-top-width:${b.th || 1}px">`;
  else if (b.type === "spacer") inner = `<div style="height:${b.h}px"></div>`;
  else if (b.type === "table") {
    const cs = b.headers.length;
    const w = b.w, colw = (w / cs).toFixed(1);
    let h = `<table class="tb" style="width:${w}px"><colgroup>${b.headers.map(() => `<col style="width:${colw}px">`).join("")}</colgroup><thead><tr>`;

  catch (e) {
    try { await clientExport("pdf"); toast("PDF downloaded"); }
    catch (e2) { toast("Opening print dialog - choose Save as PDF"); setTimeout(() => window.print(), 600); }
  }
};
const doPng = async () => {
  toast("Rendering PNG…");
  try { await serverExport("png"); toast("PNG downloaded"); }
  catch (e) { try { await clientExport("png"); toast("PNG downloaded"); } catch (e2) { toast("PNG export failed (offline?)"); } }
};
$("bDownload").onclick = () => { try { localStorage.setItem("cover.fmt", $("fmt").value); } catch (e) {} return $("fmt").value === "pdf" ? doPdf() : doPng(); };
try { const f = localStorage.getItem("cover.fmt"); if (f === "pdf" || f === "png") $("fmt").value = f; } catch (e) {}
document.addEventListener("click", (e) => { const d = $("more"); if (d.open && !d.contains(e.target)) d.open = false; });
$("bPrint").onclick = () => window.print();
$("bSave").onclick = () => download(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }), fileBase() + ".json");
$("bLoad").onclick = () => $("fJson").click();
$("fJson").onchange = (e) => e.target.files[0] && loadJson(e.target.files[0]);
function loadJson(f) { const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.blocks || !d.page) throw 0; S = d; sel = null; render(); save(); toast("Design loaded"); } catch (e) { toast("Not a valid design file"); } }; r.readAsText(f); }
$("bReset").onclick = () => { if (confirm("Reset the cover page to the default design?")) { S = defaults(); sel = null; render(); save(); } };
$("bLink").onclick = () => {
  const t = (n) => (S.blocks.find((b) => b.key === n) || {}).html || "";
  const strip = (h) => String(h).replace(/<br>/g, "\n").replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&");
  const tb = S.blocks.find((b) => b.type === "table");
  const q = new URLSearchParams();
  q.set("title", strip(t("title"))); q.set("term", strip(t("term"))); q.set("batch", strip(t("batch")).replace(/^Batch\s*/, ""));
  const course = strip(t("course")).split("\n"); q.set("course", (course[0] || "").replace(/^Course Title:\s*/, "")); q.set("code", (course[1] || "").replace(/^Course code:\s*/, ""));
  q.set("assignment", strip(t("assignment")).replace(/^Assignment:\s*/, "")); q.set("date", strip(t("date")).replace(/^Date of Submission:\s*/, ""));
  ["teacher", "role", "dept", "university", "city"].forEach((k) => q.set(k, strip(t(k))));
  if (tb) tb.rows.forEach((r, i) => { q.set(i ? "id" + (i + 1) : "id", strip(r[0])); q.set(i ? "name" + (i + 1) : "name", strip(r[1])); });
  const u = location.origin + location.pathname + "?" + q.toString();
  (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast("Link copied"), () => prompt("Copy this link", u));
};
let tt; function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2600); }

/* ---------- boot: saved design > local preset > defaults ---------- */
(async function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (saved && saved.blocks && saved.page) S = saved;
  else if (fromUrl) S = defaults(urlVals());
  else {
    try { const r = await fetch("/cover/preset.local.json"); if (r.ok) { const d = await r.json(); if (d.blocks && d.page) S = d; } } catch (e) {}
  }
  if (!S) S = defaults();
  if (QP.get("file")) $("fname").value = QP.get("file");
  wirePanel(); render();
  document.body.dataset.ready = "1";
  const auto = QP.get("download");
  if (auto === "pdf" || auto === "png") { $("fmt").value = auto; setTimeout(() => $("bDownload").click(), 700); }
})();
document.addEventListener("click", (e) => { if (!e.composedPath().some((n) => n.id === "bubble" || n.id === "panel" || n.id === "topbar" || (n.classList && n.classList.contains("blk")))) { sel = null; document.querySelectorAll(".blk.sel").forEach((x) => x.classList.remove("sel")); syncPanel(); } });
</script>
</body>
